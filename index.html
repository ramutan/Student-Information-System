<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar — Student Information Management</title>
    <meta name="description" content="A simple student information management system.">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fafafa;
            color: #171717;
            font-family: Barlow, Arial, sans-serif;
            font-size: 14px;
        }

        header {
            height: 82px;
            border-bottom: 1px solid #dedede;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5.5%;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: #d71920;
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 24px;
        }

        .brand h1 {
            margin: 0;
            font-family: Archivo, Arial, sans-serif;
            letter-spacing: 3px;
            font-size: 19px;
        }

        .brand p {
            margin: 4px 0 0;
            color: #777;
            font-size: 10px;
            letter-spacing: 2px;
        }

        .primary {
            background: #171717;
            color: #fff;
            border: 0;
            padding: 12px 20px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .primary:hover {
            background: #444;
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 34px 24px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .stat {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
        }

        .stat span {
            font-size: 10px;
            color: #777;
            letter-spacing: 1.4px;
            font-weight: 700;
        }

        .stat b {
            display: block;
            font-family: Archivo, Arial, sans-serif;
            font-size: 26px;
            margin-top: 15px;
        }

        .stat small {
            display: block;
            color: #777;
            margin-top: 4px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 30px 0 12px;
        }

        .toolbar input,
        .toolbar select {
            height: 34px;
            border: 1px solid #ccc;
            background: #fff;
            padding: 0 11px;
            font: inherit;
        }

        .toolbar input {
            width: 270px;
        }

        .toolbar select {
            width: 205px;
        }

        .records {
            margin-left: auto;
            color: #777;
            font-size: 12px;
        }

        .csv {
            border: 1px solid #ccc;
            background: #fff;
            color: #171717;
            text-decoration: none;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid #ddd;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            text-align: left;
            padding: 13px 10px;
            border-bottom: 1px solid #e7e7e7;
            font-size: 12px;
        }

        th {
            background: #f2f2f2;
            font-size: 11px;
        }

        th a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .id {
            font-family: monospace;
            color: #777;
        }

        .muted {
            color: #777;
        }

        .tag,
        .gpa {
            display: inline-block;
            padding: 4px 7px;
            background: #f0f0f0;
            font-size: 10px;
        }

        .gpa {
            font-weight: 700;
        }

        .gpa.high {
            background: #171717;
            color: #fff;
        }

        .gpa.low {
            background: #fde8e8;
            color: #c1121f;
            border: 1px solid #e6a3a3;
        }

        .actions {
            display: flex;
            gap: 3px;
            justify-content: flex-end;
        }

        .actions button {
            background: none;
            border: 0;
            cursor: pointer;
            font-size: 15px;
        }

        .actions .danger {
            color: #d71920;
        }

        .empty {
            text-align: center;
            height: 130px;
            color: #777;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .modal {
            position: relative;
            background: #fff;
            width: min(650px, calc(100% - 30px));
            padding: 25px 17px 18px;
            box-shadow: 0 8px 30px #0004;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            font-family: Archivo, Arial, sans-serif;
            font-size: 20px;
            margin: 0 0 5px;
        }

        .modal>p {
            font-size: 11px;
            color: #777;
            margin: 0 0 20px;
        }

        .close {
            position: absolute;
            right: 13px;
            top: 10px;
            border: 0;
            background: none;
            font-size: 20px;
            cursor: pointer;
        }

        .modal h3 {
            font-size: 10px;
            letter-spacing: .7px;
            margin: 19px 0 7px;
        }

        .modal label {
            display: block;
            font-size: 11px;
            margin-bottom: 11px;
        }

        .modal input,
        .modal select {
            display: block;
            width: 100%;
            height: 30px;
            border: 1px solid #ccc;
            padding: 0 9px;
            margin-top: 5px;
            font: inherit;
            background: #fff;
        }

        .grid2,
        .grid3 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .grid3 {
            grid-template-columns: 1.2fr 1.2fr .9fr;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 20px;
        }

        .modal-actions button {
            border: 1px solid #ccc;
            background: #fff;
            padding: 10px 16px;
            cursor: pointer;
        }

        .modal-actions .primary {
            border: 0;
            background: #171717;
        }

        .modal dl {
            margin: 20px 0;
        }

        .modal dt {
            font-size: 10px;
            letter-spacing: 1px;
            color: #777;
            text-transform: uppercase;
            margin-top: 12px;
        }

        .modal dd {
            margin: 3px 0;
            padding: 9px;
            background: #f5f5f5;
        }

        .banner {
            max-width: 1180px;
            margin: 14px auto 0;
            padding: 0 24px;
        }

        .banner div {
            background: #fff8e1;
            border: 1px solid #f0d78c;
            color: #7a5b00;
            padding: 10px 14px;
            font-size: 12px;
        }

        @media(max-width:700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-wrap: wrap;
            }

            .records {
                margin-left: 0;
            }

            .grid2,
            .grid3 {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 20px;
            }

            .brand p {
                display: none;
            }

            main {
                padding: 22px 12px;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo"></div>
            <div>
                <h1>REGISTRAR</h1>
                <p>STUDENT INFORMATION MANAGEMENT</p>
            </div>
        </div>
        <button class="primary" onclick="openForm()">＋ ADD STUDENT</button>
    </header>

    <main>
        <section class="stats" id="stats"></section>
        <form class="toolbar" id="toolbar" onsubmit="return false">
            <input id="q" placeholder="⌕  Search by name, ID, email, or course…" oninput="render()">
            <select id="courseFilter" onchange="render()">
                <option value="all">All courses</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Computer Science">Computer Science</option>
            </select>
            <span class="records" id="recordsLabel"></span>
            <a class="csv" onclick="downloadCsv()">⇩ CSV</a>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th><a onclick="setSort('id')" id="sortId">Student ID ↕</a></th>
                        <th><a onclick="setSort('name')" id="sortName">Name ↕</a></th>
                        <th>Course</th>
                        <th>Year</th>
                        <th>Perpetual Email</th>
                        <th><a onclick="setSort('gpa')" id="sortGpa">GPA ↕</a></th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <div id="modal" class="overlay">
        <div class="modal">
            <button class="close" onclick="closeForm()">×</button>
            <h2 id="formTitle">Enroll a new student</h2>
            <p id="formSub">The next record will be assigned automatically.</p>
            <form onsubmit="return saveStudent(event)">
                <input type="hidden" id="oldId">
                <h3>ACADEMIC INFORMATION</h3>
                <label>Full name<input id="name" placeholder="e.g. Prince Ram"></label>
                <div class="grid3">
                    <label>Course
                        <select id="course">
                            <option value="">Choose…</option>
                            <option>Information Technology</option>
                            <option>Computer Science</option>
                        </select>
                    </label>
                    <label>Year level
                        <select id="year">
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </label>
                    <label>GPA (0.00 – 4.00)<input id="gpa" type="number" min="0" max="4" step=".01" placeholder="3.50"></label>
                </div>
                <h3>PERSONAL INFORMATION</h3>
                <div class="grid2">
                    <label>Date of birth<input id="dob" type="date"></label>
                    <label>Phone number<input id="phone" placeholder="+63 917 555 0123"></label>
                </div>
                <label>Address<input id="address" placeholder="Street, barangay, city"></label>
                <div class="grid2">
                    <label>Personal email<input id="personalEmail" type="email" placeholder="name@gmail.com"></label>
                    <label>Perpetual email<input id="perpetualEmail" type="email" placeholder="name@perpetual.edu.ph"></label>
                </div>
                <div class="modal-actions">
                    <button type="button" onclick="closeForm()">Cancel</button>
                    <button class="primary" id="saveBtn">Add student</button>
                </div>
            </form>
        </div>
    </div>

    <div id="viewModal" class="overlay">
        <div class="modal">
            <button class="close" onclick="document.getElementById('viewModal').style.display='none'">×</button>
            <div id="viewBody"></div>
        </div>
    </div>

    <script>
        let data = [
            s("23-2033-379", "Prince Ram Roydlikent F. Igna", "Information Technology", "2ND Year", 3.95, "Phs6A Santa Ines Street Tierra Nevada, General Trias, Cavite", "+63 994 813 1740", "2005-11-23", "princeram2305@gmail.com", "princeramroydliken@perpetual.edu.ph"),
        ];

        function s(id, name, course, year, gpa, address, phone, dob, personalEmail, perpetualEmail) {
            return { id, name, course, year, gpa, address, phone, dob, personalEmail, perpetualEmail };
        }

        let sortField = 'id', sortDesc = false;

        function nextId() {
            let max = 26000000;
            for (const st of data) {
                const n = parseInt(st.id.replace(/-/g, ''));
                if (!isNaN(n)) max = Math.max(max, n);
            }
            const digits = String(max + 1).padStart(9, '0');
            return digits.slice(0, 2) + '-' + digits.slice(2, 6) + '-' + digits.slice(6);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function visibleStudents() {
            const q = document.getElementById('q').value.toLowerCase().trim();
            const course = document.getElementById('courseFilter').value;
            let list = data.filter(st =>
                (course === 'all' || st.course === course) &&
                (q === '' || (st.name + ' ' + st.id + ' ' + st.personalEmail + ' ' + st.perpetualEmail + ' ' + st.course).toLowerCase().includes(q))
            );
            const cmp = {
                id: (a, b) => a.id.localeCompare(b.id),
                name: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }),
                gpa: (a, b) => a.gpa - b.gpa,
            }[sortField];
            list.sort((a, b) => sortDesc ? -cmp(a, b) : cmp(a, b));
            return list;
        }

        function render() {
            const visible = visibleStudents();
            const avg = data.length ? (data.reduce((sum, st) => sum + st.gpa, 0) / data.length) : 0;
            const top = data.reduce((best, st) => (!best || st.gpa > best.gpa) ? st : best, null);
            const honors = data.filter(st => st.gpa >= 3.7).length;

            document.getElementById('stats').innerHTML =
                `<div class="stat"><span>♙ &nbsp; ENROLLED STUDENTS</span><b>${data.length}</b><small>${honors} on the honors list</small></div>
                 <div class="stat"><span>♙ &nbsp; AVERAGE GPA</span><b>${avg.toFixed(2)}</b><small>across the whole registry</small></div>
                 <div class="stat"><span>♧ &nbsp; TOP OF CLASS</span><b>${top ? escapeHtml(top.name) : '—'}</b>
                   <small>${top ? top.gpa.toFixed(2) + ' GPA · ' + escapeHtml(top.course) : 'no records'}</small></div>`;

            document.getElementById('recordsLabel').textContent = `${visible.length} of ${data.length} records`;

            for (const f of ['id', 'name', 'gpa']) {
                document.getElementById('sort' + f[0].toUpperCase() + f.slice(1)).parentElement.querySelector('a').textContent =
                    ({ id: 'Student ID', name: 'Name', gpa: 'GPA' })[f] + ' ↕';
            }

            const rows = document.getElementById('rows');
            if (visible.length === 0) {
                rows.innerHTML = `<tr><td colspan="7" class="empty">No records match your search.</td></tr>`;
                return;
            }
            rows.innerHTML = visible.map(st => {
                const gpaClass = st.gpa >= 3.7 ? 'high' : (st.gpa < 3 ? 'low' : 'mid');
                const tag = st.course.startsWith('Information') ? 'IT' : 'CS';
                return `<tr><td class="id">${escapeHtml(st.id)}</td>
                  <td><strong>${escapeHtml(st.name)}</strong></td>
                  <td><span class="tag">${tag}</span> ${escapeHtml(st.course)}</td>
                  <td>${escapeHtml(st.year)}</td>
                  <td class="muted">${escapeHtml(st.perpetualEmail)}</td>
                  <td><span class="gpa ${gpaClass}">${st.gpa.toFixed(2)}</span></td>
                  <td class="actions">
                    <button onclick="viewStudent('${st.id}')">◉</button>
                    <button onclick="openForm('${st.id}')">✎</button>
                    <button class="danger" onclick="deleteStudent('${st.id}')">♙</button>
                  </td></tr>`;
            }).join('');
        }

        function setSort(field) {
            if (sortField === field) sortDesc = !sortDesc; else { sortField = field; sortDesc = false; }
            render();
        }

        function openForm(id) {
            document.getElementById('modal').style.display = 'flex';
            document.querySelector('#modal form').reset();
            document.getElementById('oldId').value = '';
            document.getElementById('formTitle').textContent = 'Enroll a new student';
            document.getElementById('formSub').textContent = 'The next record will be assigned automatically.';
            document.getElementById('saveBtn').textContent = 'Add student';
            if (id) {
                const st = data.find(d => d.id === id);
                if (!st) return;
                for (const key of ['name', 'course', 'year', 'gpa', 'address', 'phone', 'dob', 'personalEmail', 'perpetualEmail']) {
                    document.getElementById(key).value = st[key];
                }
                document.getElementById('oldId').value = st.id;
                document.getElementById('formTitle').textContent = 'Edit ' + st.name;
                document.getElementById('formSub').textContent = 'Student ID ' + st.id;
                document.getElementById('saveBtn').textContent = 'Save changes';
            }
        }

        function closeForm() {
            document.getElementById('modal').style.display = 'none';
        }

        function saveStudent(evt) {
            evt.preventDefault();
            const name = document.getElementById('name').value.trim();
            const course = document.getElementById('course').value;
            const year = document.getElementById('year').value;
            const gpa = Number(document.getElementById('gpa').value);
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const dob = document.getElementById('dob').value;
            const personalEmail = document.getElementById('personalEmail').value.trim();
            const perpetualEmail = document.getElementById('perpetualEmail').value.trim();
            const phoneOk = /^[+()\d][\d\s().-]{6,}$/.test(phone);
            const emailOk = v => /^\S+@\S+\.\S+$/.test(v);

            if (!name || !course || !address || !dob || !phoneOk || !emailOk(personalEmail) || !emailOk(perpetualEmail) ||
                isNaN(gpa) || gpa < 0 || gpa > 4) {
                alert('Please complete the required fields and enter a GPA from 0.00 to 4.00.');
                return false;
            }
            const oldId = document.getElementById('oldId').value;
            const record = s(oldId || nextId(), name, course, year, gpa, address, phone, dob, personalEmail, perpetualEmail);
            if (oldId) {
                const i = data.findIndex(d => d.id === oldId);
                data[i] = record;
            } else {
                data.push(record);
            }
            closeForm();
            render();
            return false;
        }

        function deleteStudent(id) {
            if (!confirm('Delete this record?')) return;
            data = data.filter(st => st.id !== id);
            render();
        }

        function viewStudent(id) {
            const st = data.find(d => d.id === id);
            if (!st) return;
            let ageSuffix = '';
            try {
                const dob = new Date(st.dob), now = new Date();
                let age = now.getFullYear() - dob.getFullYear();
                if (now.getMonth() < dob.getMonth() || (now.getMonth() === dob.getMonth() && now.getDate() < dob.getDate())) age--;
                ageSuffix = ' (' + age + ' yrs old)';
            } catch (e) { }
            const gpaClass = st.gpa >= 3.7 ? 'high' : (st.gpa < 3 ? 'low' : 'mid');
            document.getElementById('viewBody').innerHTML =
                `<h2>${escapeHtml(st.name)}</h2><p class="id">${escapeHtml(st.id)}</p>
                 <p><span class="tag">${escapeHtml(st.course)}</span> <span class="tag">${escapeHtml(st.year)}</span>
                   <span class="gpa ${gpaClass}">GPA ${st.gpa.toFixed(2)}</span></p>
                 <dl><dt>Date of birth</dt><dd>${escapeHtml(st.dob)}${ageSuffix}</dd>
                 <dt>Phone</dt><dd>${escapeHtml(st.phone)}</dd>
                 <dt>Address</dt><dd>${escapeHtml(st.address)}</dd>
                 <dt>Personal email</dt><dd>${escapeHtml(st.personalEmail)}</dd>
                 <dt>Perpetual email</dt><dd>${escapeHtml(st.perpetualEmail)}</dd></dl>
                 <button class="primary" id="editFromView">✎ Edit record</button>`;
            document.getElementById('editFromView').onclick = () => openForm(st.id);
            document.getElementById('viewModal').style.display = 'flex';
        }

        function downloadCsv() {
            const rows = [['id', 'name', 'course', 'year', 'gpa', 'address', 'phone', 'date_of_birth', 'personal_email', 'perpetual_email']];
            for (const st of visibleStudents()) {
                rows.push([st.id, st.name, st.course, st.year, st.gpa.toFixed(2), st.address, st.phone, st.dob, st.personalEmail, st.perpetualEmail]);
            }
            const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'students.csv';
            a.click();
        }

        render();
    </script>
</body>
</html>
