<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IV. Family Data — Registrar SIS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="IV. Family Data">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <form id="sectionForm" class="sheet-card">
                <div class="band">IV · Family Data — Parents</div>
                <div class="sheet-body">
                    <div class="grid g3">
                        <label class="field">Father's name<input name="fatherName" placeholder="e.g. Rambo Igna"></label>
                        <label class="field">Occupation<input name="fatherOccupation" placeholder="e.g. Software Developer"></label>
                        <label class="field">Company name<input name="fatherCompany"></label>
                    </div>

                     <div class="grid g3">
                        <label class="field">Company address<input name="fatherCompanyAddress"></label>
                        <label class="field">Telephone no.<input name="fatherPhone"></label>
                        <label class="field">Father's email address<input type="email" name="fatherEmail"></label>
                    </div>

                    <div class="grid g3">
                        <label class="field">Mother's name<input name="motherName" placeholder="e.g. Maria Santos "></label>
                        <label class="field">Occupation<input name="motherOccupation" placeholder="e.g. Call center agent"></label>
                        <label class="field">Company name<input name="motherCompany"></label>
                    </div>

                    <div class="grid g3">
                        <label class="field">Company address<input name="motherCompanyAddress"></label>
                        <label class="field">Telephone no.<input name="motherPhone"></label>
                        <label class="field">Mother's email address<input type="email" name="motherEmail"></label>
                    </div>
                </div>


        </div>
    </main>
</div>
</body>

</html>
