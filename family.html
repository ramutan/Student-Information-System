<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IV. Family Data — Registrar SIS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="IV. Family Data">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <form id="sectionForm" class="sheet-card">
                <div class="band">IV · Family Data — Parents</div>
                <div class="sheet-body">
                    <div class="grid g3">
                        <label class="field">Father's name<input name="fatherName" placeholder="e.g. Rambo Igna"></label>
                        <label class="field">Occupation<input name="fatherOccupation" placeholder="e.g. Software Developer"></label>
                        <label class="field">Company name<input name="fatherCompany"></label>
                    </div>

                     <div class="grid g3">
                        <label class="field">Company address<input name="fatherCompanyAddress"></label>
                        <label class="field">Telephone no.<input name="fatherPhone"></label>
                        <label class="field">Father's email address<input type="email" name="fatherEmail"></label>
                    </div>

                    <div class="grid g3">
                        <label class="field">Mother's name<input name="motherName" placeholder="e.g. Maria Santos "></label>
                        <label class="field">Occupation<input name="motherOccupation" placeholder="e.g. Call center agent"></label>
                        <label class="field">Company name<input name="motherCompany"></label>
                    </div>

                    <div class="grid g3">
                        <label class="field">Company address<input name="motherCompanyAddress"></label>
                        <label class="field">Telephone no.<input name="motherPhone"></label>
                        <label class="field">Mother's email address<input type="email" name="motherEmail"></label>
                    </div>
                </div>

                <div class="band">Brother(s) / Sister(s)
                    <button type="button" class="band-btn" id="addSibling">＋ Add brother / sister</button>
                </div>
                <div class="sheet-body">
                    <p class="subnote">List your siblings with their date of birth, course or occupation, and school or company.</p>
                    <div id="siblingRows" style="display:grid;gap:12px"></div>
                </div>

                <div class="actions">
                    <span class="stamp" id="savedStamp"></span>
                    <button type="button" class="btn ghost" id="resetBtn">Reset</button>
                    <button type="button" class="btn primary" id="saveBtn">Save changes</button>
                </div>
            </form>
        </div>
    </main>
</div>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
    const list = document.getElementById('siblingRows');

    function addRow(v = {}) {
        const div = document.createElement('div');
        div.className = 'row-dyn';
        div.innerHTML = `
            <label class="field">Name<input name="sibName" value="${SIS.esc(v.name || '')}"></label>
            <label class="field">Date of birth<input type="date" name="sibDob" value="${SIS.esc(v.dob || '')}"></label>
            <label class="field">Course / occupation<input name="sibCourse" value="${SIS.esc(v.course || '')}"></label>
            <label class="field">School / company<input name="sibSchool" value="${SIS.esc(v.school || '')}"></label>
            <button type="button" class="row-del" title="Remove sibling">✕</button>`;
        div.querySelector('.row-del').addEventListener('click', () => div.remove());
        list.appendChild(div);
    }

    window.collectExtra = obj => {
        obj.siblings = [...list.querySelectorAll('.row-dyn')].map(r => ({
            name: r.querySelector('[name="sibName"]').value.trim(),
            dob: r.querySelector('[name="sibDob"]').value,
            course: r.querySelector('[name="sibCourse"]').value.trim(),
            school: r.querySelector('[name="sibSchool"]').value.trim(),
        })).filter(s => s.name || s.dob || s.course || s.school);
    };
    window.applyExtra = vals => {
        (vals.siblings && vals.siblings.length ? vals.siblings : [{}]).forEach(addRow);
    };

    document.getElementById('addSibling').addEventListener('click', () => addRow());
    SIS.bindSection('family');
})();
</script>
</body>
</html>
