<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>I. Personal Data — Registrar SIS</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem('sis_theme') || 'dark';</script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="I. Personal Data">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <form id="sectionForm" class="sheet-card">
                <div class="band">General Student Information Sheet <small>Academic standing</small></div>
                <div class="sheet-body">
                    <div class="grid g3">
                        <label class="field">Course
                            <select name="course"><option value="">Choose…</option><option>Bachelor of Science in Information Technology</option><option>Bachelor of Science in Computer Science</option></select>
                        </label>
                        <label class="field">Major / specialization<input name="major" placeholder="e.g. Game Development"></label>
                        <label class="field">Curriculum year<input name="curriculumYear" placeholder="e.g. 2022 to 2023"></label>
                    </div>
                    <div class="grid g3">
                        <label class="field">Year level
                            <select name="yearLevel"><option value="">Choose…</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select>
                        </label>
                        <label class="field">Term
                            <select name="term"><option value="">Choose…</option><option>1st Sem</option><option>2nd Sem</option><option>Summer</option></select>
                        </label>
                        <label class="field">School year<input name="schoolYear" placeholder="e.g. 2026 to 2027"></label>
                    </div>
                </div>

                <div class="band">I-A · Personal Data</div>
                <div class="sheet-body">
                    <div class="grid g3">
                        <label class="field">Last name<input name="lastName" placeholder="e.g. IGNA"></label>
                        <label class="field">First name<input name="firstName" placeholder="e.g. Prince Ram Roydlikent"></label>
                        <label class="field">Middle name<input name="middleName" placeholder="e.g. Fajardo"></label>
                    </div>
                    <label class="field">Name in native language character<input name="nativeLanguage"></label>
                    <div class="grid g3">
                        <label class="field">Gender<select name="gender"><option value="">Choose…</option><option>Male</option><option>Female</option></select></label>
                        <label class="field">Religion<input name="religion" placeholder="e.g. Roman Catholic"></label>
                        <label class="field">Nationality<input name="nationality" placeholder="e.g. Filipino"></label>
                    </div>
                    <div class="grid g3">
                        <label class="field">Civil status
                            <select name="civilStatus"><option value="">Choose…</option><option>Single</option><option>Married</option><option>Separated</option><option>Widowed</option></select>
                        </label>
                        <label class="field">Date of birth<input type="date" name="dob"></label>
                        <label class="field">Place of birth<input name="placeOfBirth" placeholder="e.g. Caloocan City"></label>
                    </div>
                    <div class="grid g3">
                        <label class="field">Birth order<input type="number" name="birthOrder" min="1"></label>
                        <label class="field">Mobile number<input name="mobile" placeholder="e.g. 09948131740"></label>
                        <label class="field">Email address<input type="email" name="email" placeholder="name@gmail.com"></label>
                    </div>
                </div>

                <div class="band">I-B · Alien Status Data <small>(for alien / foreign students only)</small></div>
                <div class="sheet-body">
                    <div class="grid g2">
                        <label class="field">Visa status<input name="visaStatus"></label>
                        <label class="field">Authorized stay until<input name="authorizedStay"></label>
                    </div>
                    <div class="grid g3">
                        <label class="field">Passport no.<input name="passportNo"></label>
                        <label class="field">Place of issue<input name="passportIssuePlace"></label>
                        <label class="field">Expiration date<input name="passportExpiry"></label>
                    </div>
                    <div class="grid g3">
                        <label class="field">ACR no.<input name="acrNo"></label>
                        <label class="field">Date of issue<input name="acrIssueDate"></label>
                        <label class="field">Expiration date<input name="acrExpiry"></label>
                    </div>
                    <div class="grid g3">
                        <label class="field">CRTIS no.<input name="crtisNo"></label>
                        <label class="field">Date of issue<input name="crtisIssueDate"></label>
                        <label class="field">Expiration date<input name="crtisExpiry"></label>
                    </div>
                </div>

                <div class="actions">
                    <span class="stamp" id="savedStamp"></span>
                    <button type="button" class="btn ghost" id="resetBtn">Reset</button>
                    <button type="button" class="btn primary" id="saveBtn">Save changes</button>
                </div>
            </form>
        </div>
    </main>
</div>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>SIS.bindSection('personal');</script>
</body>
</html>
