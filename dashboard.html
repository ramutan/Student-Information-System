<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Registrar SIS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-title=="Dashboard">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">
            <section class="sheet-card dash-hero">
                <div class="band">General Student Personal Information Sheet (GSPIS)</div>
                <div class="sheet-body">
                    <h2 id="welcome"></h2>
                    <p class="subnote">Complete all seven (7) sections below. Every section is saved when you press “Save changes”, and your progress is tracked automatically.</p>
                    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
                    <div clsss="prog-caption" id="progCaption"></div>
                </div>
            </section>

            <div class="dash-grid">
                <section>
                    <h3 class="sec-title">Information sheet sections</h3>
                    <div class="checklist" id="checklist"></div>
                </section>

                <section>
                    <h3 class="sec-title">My Account</h3>
                    <div class="sheet-card"></div>
                    <form class="sheet-body" id="pwForm" novalidate>
                        <label class="field">Current password<input type="password" name="current" autocomplete="current-password"></label>
                        <label class="field">New password<input type="password" name="next" autocomplete="new-password"></label>
                        <label class="field">Confirm new password<input type="password" name="confirm" autocomplete="new-password"></label>
                        <div class="form-error" id="pwError"></div>
                        <div><button class="btn primary">Update password</button></div>
                    </form>
                </div>
        <   /div>
            <button class="btn danger sm no-print" onclick="wipe()">Delete all my records</button>"
        </section>
       </div>
      </div>
    </main>
</div>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script> 
 (function () {
    const user = SIS.currentUser();
    const prog = SIS.progress();
    document.getElementById('welcome').textContent = 'Welcome, ' + user.username + '.';
    document.getElementById('progFill').style.width = prog.percent + '%';
    document.getElementById('progCaption').textContent = prog.percent + '% of your information sheet is complete.';

    const statusOf = key => {
        const p = prog.per[key];
        return p.total > 0 && p.filled === p.total ? 'done' : (p.filled ? 'partial' : 'empty');
    };
    const statusLabel = { done: 'Complete', partial: 'In progress', empty: 'Empty' };

    document.getElementById('checklist').innerHTML = SIS.SECTIONS.map(s => {
        const st = statusOf(s.key);
        return `<a class="check-item" href="${s.href}">
            <span class="num">${s.num}</span>
            <span><strong>${s.label}</strong><br><small>${prog.per[s.key].filled} of ${prog.per[s.key].total} fields filled</small></span>
            <span class="chip ${st}">${statusLabel[st]}</span></a>`;
    }).join('');

    document.getElementById('accountInfo').innerHTML = `
        <label class="field">Username<input value="${SIS.esc(user.username)}" disabled></label>
        <label class="field">Email<input value="${SIS.esc(user.email)}" disabled></label>
        <label class="field">Student number<input value="${SIS.esc(user.studentNo || '— not set —')}" disabled></label>`;

    document.getElementById('pwForm').addEventListener('submit', e => {
        e.preventDefault();
        const f = e.target, box = document.getElementById('pwError');
        box.classList.remove('on');
        if (f.next.value !== f.confirm.value) { box.textContent = 'New passwords do not match.'; box.classList.add('on'); return; }
        const res = SIS.changePassword(f.current.value, f.next.value);
        if (res.error) { box.textContent = res.error; box.classList.add('on'); return; }
        f.reset();
        SIS.toast('Password updated successfully.');
    });
})();

function wipe() {
    if (confirm('Permanently delete ALL of your records? This action cannot be undone.')) {
        SIS.wipeRecords();
        location.reload();
    }
}
</script>
</body>
</html>
