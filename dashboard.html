<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.dataset.theme = localStorage.getItem('sis_theme') || 'dark';</script>
    <title>Dashboard — Registrar SIS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-title="Dashboard">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <header class="topbar" id="topbar"></header>
        <div class="content">

            <!-- ===== hero / progress ===== -->
            <section class="sheet-card dash-hero">
                <div class="band">General Student Personal Information Sheet (GSPIS)</div>
                <div class="sheet-body">
                    <h2 id="welcome"></h2>
                    <p class="subnote">Complete all seven (7) sections below. Every section is saved when you press “Save changes”, and your progress is tracked automatically.</p>
                    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
                    <div class="prog-caption" id="progCaption"></div>
                </div>
            </section>

            <div class="dash-grid">
                <!-- ===== left: sections checklist ===== -->
                <section>
                    <h3 class="sec-title">Information sheet sections</h3>
                    <div class="checklist" id="checklist"></div>
                </section>

                <!-- ===== right: account + password ===== -->
                <section>
                    <h3 class="sec-title">My account</h3>
                    <div class="sheet-card">
                        <div class="sheet-body" id="accountInfo"></div>
                    </div>

                    <div class="sheet-card">
                        <div class="band">Change password</div>
                        <form class="sheet-body" id="pwForm" novalidate>
                            <label class="field">Current password
                                <div class="pw-wrap"><input type="password" name="current" autocomplete="current-password"><button type="button" class="pw-eye" aria-label="Show password"></button></div>
                            </label>
                            <label class="field">New password
                                <div class="pw-wrap"><input type="password" name="next" autocomplete="new-password"><button type="button" class="pw-eye" aria-label="Show password"></button></div>
                            </label>
                            <ul class="pw-rules" id="pwRulesDash"></ul>
                            <label class="field">Confirm new password
                                <div class="pw-wrap"><input type="password" name="confirm" autocomplete="new-password"><button type="button" class="pw-eye" aria-label="Show password"></button></div>
                            </label>
                            <div class="form-error" id="pwError"></div>
                            <div><button type="submit" class="btn primary">Update password</button></div>
                        </form>
                    </div>

                    <button type="button" class="btn danger sm no-print" onclick="wipe()">Delete all my records</button>
                </section>
            </div>

        </div>
    </main>
</div>

<!-- ⚠️ ORDER MATTERS: store.js → PDF libraries → export.js → layout.js → page script -->
<script src="js/store.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="js/export.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
    const user = SIS.currentUser();
    if (!user) { location.replace('index.html'); return; }

    /* ---------- hero ---------- */
    const prog = SIS.progress();
    document.getElementById('welcome').textContent = 'Welcome, ' + (user.fullName || user.studentNo) + '.';
    document.getElementById('progFill').style.width = prog.percent + '%';
    document.getElementById('progCaption').textContent = prog.percent + '% of your information sheet is complete.';

    /* ---------- sections checklist ---------- */
    const statusOf = key => {
        const p = prog.per[key];
        return p.total > 0 && p.filled === p.total ? 'done' : (p.filled ? 'partial' : 'empty');
    };
    const statusLabel = { done: 'Complete', partial: 'In progress', empty: 'Empty' };

    document.getElementById('checklist').innerHTML = SIS.SECTIONS.map(s => {
        const st = statusOf(s.key);
        return `<a class="check-item" href="${s.href}">
            <span class="num">${s.num}</span>
            <span><strong>${s.label}</strong><br><small>${prog.per[s.key].filled} of ${prog.per[s.key].total} fields filled</small></span>
            <span class="chip ${st}">${statusLabel[st]}</span></a>`;
    }).join('');

    /* ---------- my account card ---------- */
    document.getElementById('accountInfo').innerHTML = `
        <label class="field">Full name<input value="${SIS.esc(user.fullName || '— not set —')}" disabled></label>
        <label class="field">Email address<input value="${SIS.esc(user.email || '— not set —')}" disabled></label>
        <label class="field">Student number<input value="${SIS.esc(user.studentNo)}" disabled></label>
        <a class="btn ghost sm" href="profile.html">✎ Edit profile &amp; photo</a>`;

    /* ---------- change password ---------- */
    SIS.attachPwChecklist(document.querySelector('#pwForm [name="next"]'), document.getElementById('pwRulesDash'));

    document.getElementById('pwForm').addEventListener('submit', e => {
        e.preventDefault();
        const f = e.target, box = document.getElementById('pwError');
        box.classList.remove('on');
        if (f.next.value !== f.confirm.value) { box.textContent = 'New passwords do not match.'; box.classList.add('on'); return; }
        const res = SIS.changePassword(f.current.value, f.next.value);
        if (res.error) { box.textContent = res.error; box.classList.add('on'); return; }
        f.reset();
        f.next.dispatchEvent(new Event('input'));   // reset the ✓ checklist
        SIS.toast('Password updated.');
    });
})();

/* ---------- wipe own records ---------- */
function wipe() {
    if (confirm('Permanently delete ALL of your saved records? This cannot be undone.')) {
        SIS.wipeRecords();
        location.reload();
    }
}

/* ============================================================
   SECRET ADMIN PANEL — type "admin" anywhere on the dashboard
   (not while typing in an input). Hidden from normal users.
   ============================================================ */
(function () {
    let buffer = '';
    const SECRET = 'admin';

    function openAdminPanel() {
        document.getElementById('adminPanel')?.remove();

        const users = SIS.users();
        const allData = JSON.parse(localStorage.getItem('sis_records') || '{}');

        const rows = users.map(u => {
            const d = allData[u.studentNo] || {};
            const p = SIS.progress(u.studentNo);
            let last = 0;
            for (const v of Object.values(d)) if (v && v._savedAt > last) last = v._savedAt;
            return `<tr>
                <td style="padding:8px;border-bottom:1px solid var(--line);white-space:nowrap"><b>${SIS.esc(u.studentNo)}</b></td>
                <td style="padding:8px;border-bottom:1px solid var(--line)">${SIS.esc(u.fullName || '—')}</td>
                <td style="padding:8px;border-bottom:1px solid var(--line)">${SIS.esc(u.email || '—')}</td>
                <td style="padding:8px;border-bottom:1px solid var(--line);text-align:center">${p.percent}%</td>
                <td style="padding:8px;border-bottom:1px solid var(--line);white-space:nowrap">${last ? new Date(last).toLocaleDateString() : 'never'}</td>
                <td style="padding:8px;border-bottom:1px solid var(--line);white-space:nowrap">
                    <button type="button" data-clear="${SIS.esc(u.studentNo)}" title="Keep the account, erase their typed answers"
                        style="padding:5px 9px;margin-right:4px;cursor:pointer;border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:5px;font:600 11px Barlow">Clear records</button>
                    <button type="button" data-del="${SIS.esc(u.studentNo)}" title="Remove account + records permanently"
                        style="padding:5px 9px;cursor:pointer;border:1px solid var(--danger);background:var(--danger);color:#fff;border-radius:5px;font:600 11px Barlow">Delete user</button>
                </td>
            </tr>`;
        }).join('') || '<tr><td colspan="6" style="padding:14px;color:var(--muted)">No accounts registered yet.</td></tr>';

        const overlay = document.createElement('div');
        overlay.id = 'adminPanel';
        overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px';
        overlay.innerHTML = `
            <div style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:920px;width:100%;max-height:85vh;overflow:auto;padding:22px;font:14px Barlow,Arial,sans-serif">
                <div style="display:flex;align-items:center;gap:10px">
                    <h2 style="margin:0;font-family:Archivo,Arial,sans-serif;font-size:18px">⚙ Admin Panel</h2>
                    <button type="button" id="adminClose" style="margin-left:auto;width:32px;height:32px;cursor:pointer;border:1px solid var(--line);background:var(--card-2);color:var(--ink);border-radius:6px;font-size:15px">✕</button>
                </div>
                <p style="color:var(--muted);font-size:12.5px;margin:6px 0 14px">
                    <b>Clear records</b> = keeps the account but erases their information sheet.
                    <b>Delete user</b> = removes the account AND everything they typed. Both are permanent.
                </p>
                <div style="overflow-x:auto">
                    <table style="width:100%;border-collapse:collapse;font-size:12.5px">
                        <thead><tr>
                            <th style="text-align:left;padding:8px;border-bottom:2px solid var(--line);font-family:Archivo;font-size:11px;letter-spacing:.5px">STUDENT NO</th>
                            <th style="text-align:left;padding:8px;border-bottom:2px solid var(--line);font-family:Archivo;font-size:11px;letter-spacing:.5px">NAME</th>
                            <th style="text-align:left;padding:8px;border-bottom:2px solid var(--line);font-family:Archivo;font-size:11px;letter-spacing:.5px">EMAIL</th>
                            <th style="text-align:center;padding:8px;border-bottom:2px solid var(--line);font-family:Archivo;font-size:11px;letter-spacing:.5px">PROGRESS</th>
                            <th style="text-align:left;padding:8px;border-bottom:2px solid var(--line);font-family:Archivo;font-size:11px;letter-spacing:.5px">LAST SAVED</th>
                            <th style="text-align:left;padding:8px;border-bottom:2px solid var(--line);font-family:Archivo;font-size:11px;letter-spacing:.5px">ACTIONS</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
                    <button type="button" id="axExcel" style="padding:8px 14px;cursor:pointer;border:0;background:var(--accent);color:var(--accent-ink);border-radius:6px;font:600 12px Archivo">⇩ Excel (.xls)</button>
                    <button type="button" id="axPdf"   style="padding:8px 14px;cursor:pointer;border:0;background:var(--accent);color:var(--accent-ink);border-radius:6px;font:600 12px Archivo">⇩ PDF report</button>
                    <button type="button" id="axPrint" style="padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:600 12px Archivo">⎙ Print report</button>
                    <button type="button" id="axCsv"   style="padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font:600 12px Archivo">⇩ CSV (raw)</button>
                </div>
            </div>`;
        document.body.appendChild(overlay);

        overlay.addEventListener('click', e => {
            if (e.target === overlay || e.target.id === 'adminClose') { overlay.remove(); return; }

            const del = e.target.closest('[data-del]');
            const clr = e.target.closest('[data-clear]');

            if (del) {
                const sno = del.dataset.del;
                if (confirm(`DELETE USER "${sno}"?\n\nThis permanently removes their account and ALL their typed records. This cannot be undone.`)) {
                    localStorage.setItem('sis_users', JSON.stringify(SIS.users().filter(u => u.studentNo !== sno)));
                    const all = JSON.parse(localStorage.getItem('sis_records') || '{}');
                    delete all[sno];
                    localStorage.setItem('sis_records', JSON.stringify(all));
                    SIS.toast(sno + ' deleted — gone from exports.');
                    SIS.refreshTopbar();
                    openAdminPanel();          // re-render the list
                }
            }

            if (clr) {
                const sno = clr.dataset.clear;
                if (confirm(`Clear all typed records for "${sno}"?\n\nTheir account stays, but their information sheet becomes empty.`)) {
                    const all = JSON.parse(localStorage.getItem('sis_records') || '{}');
                    delete all[sno];
                    localStorage.setItem('sis_records', JSON.stringify(all));
                    SIS.toast(sno + "'s records cleared.");
                    SIS.refreshTopbar();
                    openAdminPanel();
                }
            }
        });

        document.getElementById('axExcel').onclick = () => SIS.report.toExcel();
        document.getElementById('axPdf').onclick   = () => SIS.report.toPdf();
        document.getElementById('axPrint').onclick = () => SIS.report.print();
        document.getElementById('axCsv').onclick   = () => SIS.exportUsersCsv();
    }

    document.addEventListener('keydown', e => {
        if (/^(input|textarea|select)$/i.test(e.target.tagName)) return;
        buffer = (buffer + e.key).toLowerCase().slice(-SECRET.length);
        if (buffer === SECRET) { buffer = ''; openAdminPanel(); }
    });
})();
</script>
</body>
</html>
